<!doctype html>
<!--
  NOETIC — GitHub social preview source (1280×640).

  Rendered to docs/images/github-social-preview.png by
  scripts/capture-screenshots.mjs. Composites the real application screenshots
  (../docs/images/*.png) with the deck's own typography. Fonts are the same
  self-hosted Fontsource files the app bundles.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Fraunces Variable';
        src: url('../node_modules/@fontsource-variable/fraunces/files/fraunces-latin-full-normal.woff2') format('woff2-variations');
        font-weight: 100 900;
        font-display: block;
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        src: url('../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2') format('woff2');
        font-weight: 400;
        font-display: block;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 640px; overflow: hidden; }
      body {
        position: relative;
        background: #05060a;
        font-family: 'IBM Plex Mono', monospace;
        color: #fff;
      }
      .grid {
        position: absolute; inset: 0; opacity: 0.05;
        background-image:
          linear-gradient(#7CFFD8 1px, transparent 1px),
          linear-gradient(90deg, #7CFFD8 1px, transparent 1px);
        background-size: 48px 48px;
      }
      .glow {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse 60% 50% at 28% 38%, rgba(124,255,216,0.10), transparent 70%),
                    radial-gradient(ellipse 50% 60% at 88% 85%, rgba(139,92,246,0.10), transparent 70%);
      }
      .vignette {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse at center, transparent 55%, #05060a 100%);
      }
      .left {
        position: absolute; left: 64px; top: 72px; width: 470px;
        display: flex; flex-direction: column; gap: 0;
      }
      .eyebrow {
        display: flex; align-items: center; gap: 10px;
        color: rgba(124,255,216,0.75); font-size: 11px; letter-spacing: 0.42em;
      }
      .eyebrow svg { flex: none; }
      h1 {
        margin-top: 26px;
        font-family: 'Fraunces Variable', serif;
        font-weight: 560;
        font-optical-sizing: auto;
        font-size: 96px; line-height: 0.95; letter-spacing: 0.01em;
        color: rgba(255,255,255,0.94);
      }
      .subtitle {
        margin-top: 16px; font-size: 13px; letter-spacing: 0.52em;
        color: #7CFFD8; text-transform: uppercase;
      }
      .rule {
        margin-top: 30px; height: 1px; width: 380px;
        background: linear-gradient(90deg, #7CFFD8, #8B5CF6 55%, transparent);
        opacity: 0.8;
      }
      .bootlines { margin-top: 30px; display: flex; flex-direction: column; gap: 11px; }
      .bootlines div { font-size: 11.5px; color: rgba(255,255,255,0.55); letter-spacing: 0.04em; }
      .bootlines .ok { color: rgba(124,255,216,0.85); }
      .stack {
        position: absolute; left: 64px; bottom: 56px;
        display: flex; gap: 8px;
      }
      .stack span {
        font-size: 9.5px; letter-spacing: 0.18em; color: rgba(255,255,255,0.5);
        border: 1px solid rgba(255,255,255,0.16); border-radius: 999px;
        padding: 5px 12px;
      }
      .cards { position: absolute; right: 0; top: 0; width: 660px; height: 640px; }
      .card {
        position: absolute; border-radius: 10px; overflow: hidden;
        border: 1px solid rgba(124,255,216,0.35);
        box-shadow: 0 0 0 1px rgba(124,255,216,0.08), 0 40px 90px -30px rgba(0,0,0,0.9), 0 0 60px -20px rgba(124,255,216,0.25);
        background: #0a0b10;
      }
      .card img { display: block; width: 100%; height: auto; }
      .card-main { right: 54px; top: 64px; width: 560px; }
      .card-detail {
        left: 0; bottom: 54px; width: 300px;
        border-color: rgba(139,92,246,0.45);
        box-shadow: 0 0 0 1px rgba(139,92,246,0.1), 0 40px 90px -30px rgba(0,0,0,0.9), 0 0 50px -18px rgba(139,92,246,0.35);
      }
      .access {
        position: absolute; right: 64px; bottom: 56px;
        font-size: 10.5px; letter-spacing: 0.22em; color: rgba(124,255,216,0.5);
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow"></div>

    <div class="left">
      <div class="eyebrow">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7CFFD8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        ZAZIE&nbsp;PRODUCTIONS
      </div>
      <h1>NOETIC</h1>
      <div class="subtitle">Cognitive Command Deck</div>
      <div class="rule"></div>
      <div class="bootlines">
        <div>&gt; DETERMINISTIC GENERATIVE ENGINE .......... <span class="ok">ONLINE</span></div>
        <div>&gt; FRAGMENT ARCHIVE ........................... <span class="ok">260 ENTRIES</span></div>
        <div>&gt; SEVEN SYNTHETIC-COGNITION PANELS ........... <span class="ok">MOUNTED</span></div>
      </div>
    </div>

    <div class="stack">
      <span>REACT 19</span><span>TYPESCRIPT</span><span>VITE</span><span>TAILWIND CSS</span>
    </div>

    <div class="cards">
      <div class="card card-main"><img src="../docs/images/project-active.png" alt="" /></div>
      <div class="card card-detail"><img src="../docs/images/project-detail.png" alt="" /></div>
    </div>

    <div class="access">&gt; ACCESS GRANTED — WELCOME, ARCHITECT.</div>

    <div class="vignette"></div>
  </body>
</html>
